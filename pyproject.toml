[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fintechhub"
version = "1.0.0"
description = "FinTechHub - Personal Finance, Risk & Investment Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "werkzeug>=3.0.0",
    "jinja2>=3.1.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "joblib>=1.4.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.2.0",
    "pytest>=8.2.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=."
testpaths = [
    "tests",
]
