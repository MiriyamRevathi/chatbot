[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "chatflow"
version = "1.0.0"
description = "ChatFlow — AI Chatbot & NLP Management Platform"
authors = ["ChatFlow Engineering <engineering@chatflow.local>"]
readme = "README.md"
packages = [{include = "chatflow"}]

[tool.poetry.dependencies]
python = "^3.10"
flask = "^3.0.2"
werkzeug = "^3.0.1"
jinja2 = "^3.1.3"
pandas = "^2.2.0"
numpy = "^1.26.4"
scikit-learn = "^1.4.0"
joblib = "^1.3.2"
matplotlib = "^3.8.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = "."

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "venv/*", ".venv/*", "artifacts/*"]
