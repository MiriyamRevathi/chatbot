{% extends "base.html" %}
{% block title %}Credit Score — FinTechHub{% endblock %}
{% block content %}
<div class="credit-page space-y-6">
    <div class="page-header border-b border-[var(--border)] pb-4">
        <h1 class="text-2xl font-bold text-[var(--text-main)]">Credit Score</h1>
        <p class="text-sm text-[var(--text-muted)]">Estimated credit score analysis and factor breakdown.</p>
    </div>

    <div class="card p-6 bg-white border border-[var(--border)] rounded-xl shadow-xs text-center max-w-md mx-auto">
        <span class="text-xs font-semibold text-[var(--text-muted)] uppercase">Estimated Score</span>
        <span class="text-5xl font-black text-emerald-600 block my-2">745</span>
        <span class="badge badge-success text-xs">Good Credit Profile</span>
    </div>
</div>
{% endblock %}
