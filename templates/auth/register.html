{% extends "base.html" %}
{% block title %}Create Account — FinTechHub{% endblock %}
{% block content %}
<div class="register-page max-w-md mx-auto py-10">
    <div class="card p-6 bg-white border border-[var(--border)] rounded-2xl shadow-md">
        <div class="mb-6 text-center">
            <h1 class="text-2xl font-bold text-gray-900">Create Account</h1>
            <p class="text-xs text-gray-500 mt-1">Start managing your personal finances with FinTechHub.</p>
        </div>
        <form action="/auth/register" method="POST" class="space-y-4 text-xs">
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Full Name</label>
                <input type="text" name="full_name" class="form-control w-full px-3 py-2 border border-[var(--border)] rounded-lg" placeholder="Alex Smith" required>
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Email Address</label>
                <input type="email" name="email" class="form-control w-full px-3 py-2 border border-[var(--border)] rounded-lg" placeholder="alex@example.com" required>
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" name="password" class="form-control w-full px-3 py-2 border border-[var(--border)] rounded-lg" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-full py-2.5 rounded-lg font-semibold mt-2">Create Account</button>
        </form>
        <div class="mt-4 pt-4 border-t border-gray-100 text-center text-xs text-gray-500">
            Already have an account? <a href="/auth/login" class="text-[var(--primary)] font-semibold hover:underline">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
