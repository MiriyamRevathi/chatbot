{% extends "base.html" %}
{% block title %}Sign In — FinTechHub{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-10">
    <div class="w-full max-w-sm bg-white border border-gray-200 rounded-2xl p-8 shadow-sm">
        <!-- Logo Wordmark -->
        <div class="text-center mb-6">
            <div class="text-2xl font-black tracking-tight mb-1">
                <span class="text-gray-900">FINTECH</span><span class="text-rose-600">HUB</span><span class="text-amber-500 text-lg">✦</span>
            </div>
            <h2 class="text-xl font-bold text-gray-900">Welcome back</h2>
            <p class="text-xs text-gray-500 mt-1">Please sign in to your account</p>
        </div>

        <form action="/auth/login" method="POST" class="space-y-4 text-xs">
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Email address</label>
                <input type="text" name="username" class="form-control w-full px-3.5 py-2.5 border border-gray-200 rounded-lg" placeholder="alex@example.com" value="customer" required>
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" name="password" class="form-control w-full px-3.5 py-2.5 border border-gray-200 rounded-lg" placeholder="••••••••" value="Customer123!" required>
                <div class="text-right mt-1">
                    <a href="/auth/login" class="text-rose-600 hover:underline font-semibold text-[11px]">Forgot password?</a>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-full py-3 rounded-lg font-bold text-xs bg-rose-600 hover:bg-rose-700 text-white mt-2">Sign In</button>
        </form>

        <div class="mt-6 pt-4 border-t border-gray-100 text-center text-xs text-gray-500">
            Don't have an account? <a href="/auth/register" class="text-rose-600 font-bold hover:underline">Sign up</a>
        </div>
    </div>
</div>
{% endblock %}
