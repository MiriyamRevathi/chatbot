{% extends "base.html" %}
{% block title %}Profile & Settings — FinTechHub{% endblock %}
{% block content %}
<div class="profile-page space-y-6 max-w-3xl mx-auto">
    <div class="page-header border-b border-[var(--border)] pb-4">
        <h1 class="text-2xl font-bold text-[var(--text-main)]">Profile & Settings</h1>
        <p class="text-sm text-[var(--text-muted)]">Manage your personal details and security preferences.</p>
    </div>

    <div class="card p-6 bg-white border border-[var(--border)] rounded-xl shadow-xs space-y-4 text-xs">
        <div class="form-group">
            <label class="block font-semibold text-gray-700 mb-1">Full Name</label>
            <input type="text" class="form-control w-full px-3 py-2 border border-[var(--border)] rounded-lg" value="{{ session.get('full_name', 'Alex Customer') }}">
        </div>
        <div class="form-group">
            <label class="block font-semibold text-gray-700 mb-1">Email Address</label>
            <input type="email" class="form-control w-full px-3 py-2 border border-[var(--border)] rounded-lg" value="customer@chatflow.local">
        </div>
        <div class="form-group">
            <label class="block font-semibold text-gray-700 mb-1">User Role</label>
            <input type="text" class="form-control w-full px-3 py-2 border border-[var(--border)] rounded-lg bg-gray-50" value="{{ session.get('user_role', 'CUSTOMER') }}" readonly>
        </div>
        <div class="pt-2">
            <button class="btn btn-primary text-xs">Save Profile Changes</button>
        </div>
    </div>
</div>
{% endblock %}
