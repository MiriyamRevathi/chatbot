{% extends "base.html" %}
{% block title %}EMI Calculator — FinTechHub{% endblock %}
{% block content %}
<div class="calculator-page space-y-6 max-w-2xl mx-auto">
    <div class="page-header border-b border-[var(--border)] pb-4 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-[var(--text-main)]">EMI Calculator</h1>
            <p class="text-sm text-[var(--text-muted)]">Calculate monthly loan repayments and interest breakdown.</p>
        </div>
        <a href="/loans" class="btn btn-secondary text-xs">Back to Loans</a>
    </div>

    <div class="card p-6 bg-white border border-[var(--border)] rounded-xl shadow-xs space-y-4 text-xs">
        <div class="form-group">
            <label class="block font-semibold text-gray-700 mb-1">Loan Amount (₹)</label>
            <input type="number" class="form-control w-full px-3 py-2 border border-[var(--border)] rounded-lg" value="500000">
        </div>
        <div class="form-group">
            <label class="block font-semibold text-gray-700 mb-1">Interest Rate (% p.a.)</label>
            <input type="number" step="0.1" class="form-control w-full px-3 py-2 border border-[var(--border)] rounded-lg" value="8.5">
        </div>
        <div class="form-group">
            <label class="block font-semibold text-gray-700 mb-1">Tenure (Years)</label>
            <input type="number" class="form-control w-full px-3 py-2 border border-[var(--border)] rounded-lg" value="5">
        </div>
        <div class="pt-2 flex justify-between items-center">
            <div>
                <span class="text-gray-500 font-semibold uppercase">Estimated Monthly EMI:</span>
                <span class="text-xl font-bold text-blue-600 block">₹10,258.00</span>
            </div>
            <button class="btn btn-primary text-xs px-5 py-2.5">Calculate</button>
        </div>
    </div>
</div>
{% endblock %}
