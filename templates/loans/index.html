{% extends "base.html" %}
{% block title %}Loans & EMI — FinTechHub{% endblock %}
{% block content %}
<div class="loans-page space-y-6">
    <div class="page-header border-b border-[var(--border)] pb-4 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-[var(--text-main)]">Loans & EMI</h1>
            <p class="text-sm text-[var(--text-muted)]">Track loan repayments and EMI schedules.</p>
        </div>
        <a href="/loans" class="btn btn-primary text-xs">+ Add loan</a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
        <div class="card p-4 bg-white border border-[var(--border)] rounded-xl">
            <span class="text-[var(--text-muted)] font-semibold uppercase">Total Outstanding</span>
            <span class="text-xl font-bold text-gray-900 block mt-1">₹2,45,000.00</span>
        </div>
        <div class="card p-4 bg-white border border-[var(--border)] rounded-xl">
            <span class="text-[var(--text-muted)] font-semibold uppercase">Monthly EMI</span>
            <span class="text-xl font-bold text-rose-600 block mt-1">₹12,500.00</span>
        </div>
        <div class="card p-4 bg-white border border-[var(--border)] rounded-xl">
            <span class="text-[var(--text-muted)] font-semibold uppercase">Next Payment Date</span>
            <span class="text-xl font-bold text-gray-900 block mt-1">Sep 5, 2026</span>
        </div>
    </div>
</div>
{% endblock %}
