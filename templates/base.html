<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FinTechHub — Financial Intelligence Platform{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    {% if session.get('user_id') %}
    <!-- Top Header Navigation Bar -->
    <header class="app-top-navbar">
        <div class="navbar-container">
            <a href="{{ url_for('dashboard.index') }}" class="navbar-brand">
                <span class="brand-text-dark">FINTECH</span><span class="brand-text-red">HUB</span><span class="brand-dot">✦</span>
            </a>

            <!-- Navigation Links -->
            <nav class="navbar-menu">
                <a href="{{ url_for('dashboard.index') }}" class="nav-link {% if request.path == '/dashboard' or request.path == '/' %}active{% endif %}">Dashboard</a>
                <a href="{{ url_for('accounts.index') }}" class="nav-link {% if request.path.startswith('/accounts') %}active{% endif %}">Accounts</a>
                <a href="{{ url_for('transactions.index') }}" class="nav-link {% if request.path.startswith('/transactions') %}active{% endif %}">Transactions</a>
                <a href="{{ url_for('budget.index') }}" class="nav-link {% if request.path.startswith('/budget') %}active{% endif %}">Budget</a>
                <a href="{{ url_for('savings.index') }}" class="nav-link {% if request.path.startswith('/savings') %}active{% endif %}">Savings</a>
                <a href="{{ url_for('investments.index') }}" class="nav-link {% if request.path.startswith('/investments') %}active{% endif %}">Investments</a>
                <a href="{{ url_for('loans.index') }}" class="nav-link {% if request.path.startswith('/loans') %}active{% endif %}">Loans</a>
                <a href="{{ url_for('credit.index') }}" class="nav-link {% if request.path.startswith('/credit') %}active{% endif %}">Credit Score</a>
                <a href="{{ url_for('reports.index') }}" class="nav-link {% if request.path.startswith('/reports') %}active{% endif %}">Reports</a>
                <a href="{{ url_for('chatflow.index') }}" class="nav-link {% if request.path.startswith('/chatflow') %}active{% endif %}">ChatFlow</a>
            </nav>

            <!-- Right Actions & User Profile -->
            <div class="navbar-right">
                <a href="{{ url_for('chatflow.index') }}" class="notifications-btn" title="Notifications">
                    🔔 <span class="notification-dot"></span>
                </a>
                <div class="profile-dropdown relative">
                    <button class="profile-btn" onclick="toggleProfileMenu()">
                        <span class="user-avatar">{{ session.get('full_name', 'A')[0]|upper }}</span>
                        <span class="text-xs font-bold text-gray-800">{{ session.get('full_name', 'Alex') }}</span>
                    </button>
                    <div id="profileMenu" class="hidden absolute right-0 top-10 w-44 bg-white border border-gray-200 rounded-xl shadow-lg p-2 z-50">
                        <a href="{{ url_for('auth.profile') }}" class="block px-3 py-1.5 text-xs text-gray-700 hover:bg-gray-50 rounded-md">Profile Settings</a>
                        <div class="h-px bg-gray-100 my-1"></div>
                        <a href="{{ url_for('auth.logout') }}" class="block px-3 py-1.5 text-xs text-red-600 hover:bg-red-50 rounded-md font-semibold">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </header>
    {% endif %}

    <div class="main-wrapper">
        <main class="content-area">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        function toggleProfileMenu() {
            var menu = document.getElementById('profileMenu');
            if (menu) menu.classList.toggle('hidden');
        }
    </script>
</body>
</html>
