<div class="navbar-left">
    <div class="page-header-info">
        <h2 class="page-title">{% block page_title %}Platform Dashboard{% endblock %}</h2>
        <span class="page-subtitle">AI Chatbot & Local NLP Workspace</span>
    </div>
</div>
<div class="navbar-right">
    <a href="/chat" class="btn btn-sm btn-outline nav-btn">💬 Quick Chat</a>
    <button id="theme-toggle" class="btn btn-icon btn-theme-toggle" title="Toggle Light/Dark Theme">
        <span class="theme-icon">🌙</span>
    </button>
    {% if session.get('user_name') %}
    <div class="user-pill">
        <div class="user-avatar">{{ session.get('user_name')[0]|upper }}</div>
        <div class="user-info">
            <span class="user-name">{{ session.get('user_name') }}</span>
            <span class="badge badge-role">{{ session.get('user_role') }}</span>
        </div>
        <a href="/logout" class="btn btn-xs btn-outline btn-logout" title="Sign Out">Logout</a>
    </div>
    {% endif %}
</div>
